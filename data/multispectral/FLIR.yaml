# COCO 2017 dataset http://cocodataset.org - first 128 training images
# Train command: python train.py --data coco128.yaml
# Default dataset location is next to YOLOv5:
#   /parent_folder
#     /coco128
#     /yolov5


# download command/URL (optional)
download: https://github.com/ultralytics/yolov5/releases/download/v1.0/coco128.zip

# train and val data as 1) directory: path/images/, 2) file: path/images.txt, or 3) list: [path1/images/, path2/images/]
path: /home/cqu/LiuXiang/LCAFNet/dataset/FLIR-align-3class
train_rgb: /home/cqu/LiuXiang/LCAFNet/dataset/FLIR-align-3class/visible/train  # 128 images
val_rgb: /home/cqu/LiuXiang/LCAFNet/dataset/FLIR-align-3class/visible/test  # 128 images
train_ir: /home/cqu/LiuXiang/LCAFNet/dataset/FLIR-align-3class/infrared/train  # 128 images
val_ir: /home/cqu/LiuXiang/LCAFNet/dataset/FLIR-align-3class/infrared/test  # 128 images

# # 基础路径 (保留)
# path: /home/cqu/LiuXiang/LCAFNet/data/multispectral/FLIR_dataset

# # 训练集和测试集直接使用【绝对路径】
# train_rgb: /home/cqu/LiuXiang/LCAFNet/data/multispectral/FLIR_dataset/visible/train
# val_rgb: /home/cqu/LiuXiang/LCAFNet/data/multispectral/FLIR_dataset/visible/test
# train_ir: /home/cqu/LiuXiang/LCAFNet/data/multispectral/FLIR_dataset/infrared/train
# val_ir: /home/cqu/LiuXiang/LCAFNet/data/multispectral/FLIR_dataset/infrared/test

# number of classes
nc: 3

# class names
names: ['person', 'car', 'bicycle']

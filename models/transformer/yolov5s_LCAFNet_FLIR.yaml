# parameters
nc: 3  # number of classes
depth_multiple: 0.33  # model depth multiple
width_multiple: 0.50  # layer channel multiple

# anchors
anchors:
  - [5,6, 8,14, 15,11]  # P2/4
  - [10,13, 16,30, 33,23]  # P3/8
  - [30,61, 62,45, 59,119]  # P4/16
  - [116,90, 156,198, 373,326]  # P5/32


# YOLOv5 backbone
backbone:
  # [from, number, module, args]
  # Two Stream
  [[-1, 1, Conv, [64, 6, 2, 2]],  # 0-P1/2
   [-1, 1, Conv, [128, 3, 2]],  # 1-P2/4
   [-1, 3, C3, [128]], # 2层
   [-1, 1, Conv, [256, 3, 2]],  # 3-P3/8
   [-1, 6, C3, [256]], # 4层
   [-1, 1, Conv, [512, 3, 2]],  # 5-P4/16
   [-1, 9, C3, [512]], # 6层
   [-1, 1, Conv, [1024, 3, 2]],  # 7-P5/32
   [-1, 3, C3, [1024]], # 8层
   [-1, 1, SPPF, [1024, 5]],  # 9

    # 这里的-4，其实更多的是一种暗号，在其他代码层面会截取这个 -4
    # 表示从这一层网络开始，会重新开一个 网络的分支，用于提取 红外图片的特征
   [-4, 1, Conv, [64, 6, 2, 2]],  # 10-P1/2
   [-1, 1, Conv, [128, 3, 2]],  # 11-P2/4
   [-1, 3, C3, [128]], # 12层
   [-1, 1, Conv, [256, 3, 2]],  # 13-P3/8
   [-1, 6, C3, [256]], # 14层
   [-1, 1, Conv, [512, 3, 2]],  # 15-P4/16
   [-1, 9, C3, [512]], # 16层
   [-1, 1, Conv, [1024, 3, 2]],  # 17-P5/32
   [-1, 3, C3, [1024]], # 18层
   [-1, 1, SPPF, [1024, 5]],  # 19

    ######### Fusion Block #############
  [[2,12], 1, HAFFormer, [128]],    # 20 two stream fuse，P2阶段，通过C3模块提取更丰富的特征之后
  [[4,14], 1, HAFFormer, [256]],    # 21 two stream fuse，P3阶段，通过C3模块提取更丰富的特征之后
  [[6,16], 1, FusionMamba2, [512]],    # 22 two stream fuse，P4阶段，通过C3模块提取更丰富的特征之后
  [[9,19], 1, FusionMamba2, [1024]],    # 23 two stream fuse，P5阶段，通过C3模块提取更丰富的特征之后
  ]


# YOLOv5 head
head:
  [ [-1, 1, Conv, [512, 1, 1]], # 24
    [-1, 1, nn.Upsample, [None, 2, 'nearest']], # 25
    [[-1, 22], 1, Concat, [1]],  # cat backbone P5. 26层
    [-1, 3, C3, [512, False]],  # 27

    [-1, 1, Conv, [512, 1, 1]],
    [-1, 1, nn.Upsample, [None, 2, 'nearest']],
    [[-1, 21], 1, Concat, [1]],  # cat backbone P4
    [-1, 3, C3, [512, False]],  # 31

    [-1, 1, Conv, [256, 1, 1]],
    [-1, 1, nn.Upsample, [None, 2, 'nearest']],
    [[-1, 20], 1, Concat, [1]],  # cat backbone P3
    [-1, 3, C3, [256, False]],  # 35 (P2/4-xsmall)

    [-1, 1, Conv, [256, 3, 2]],
    [[-1, 32], 1, Concat, [1]],  # cat head P4
    [-1, 3, C3, [256, False]],  # 38 (P3/8-small)

    [-1, 1, Conv, [256, 3, 2]],
    [[-1, 28], 1, Concat, [1]],  # cat head P5
    [-1, 3, C3, [512, False]],  # 41 (P4/16-medium)

    [-1, 1, Conv, [512, 3, 2]],
    [[-1, 24], 1, Concat, [1]],  # cat head P6
    [-1, 3, C3, [1024, False]],  # 44 (P5/32-large)

    [[35, 38, 41, 44], 1, Detect, [nc, anchors]],  # Detect(P2, P3, P4, P5)
  ]
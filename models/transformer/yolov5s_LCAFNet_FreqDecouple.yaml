# parameters
nc: 3  # number of classes
depth_multiple: 0.33  # model depth multiple
width_multiple: 0.50  # layer channel multiple

# anchors
anchors:
  - [5,6, 8,14, 15,11]  # P2/4
  - [10,13, 16,30, 33,23]  # P3/8
  - [30,61, 62,45, 59,119]  # P4/16
  - [116,90, 156,198, 373,326]  # P5/32


# YOLOv5 backbone
backbone:
  # [from, number, module, args]
  # Two Stream
  [[-1, 1, Conv, [64, 6, 2, 2]],  # 0-P1/2
   [-1, 1, Conv, [128, 3, 2]],  # 1-P2/4
   [-1, 3, C3, [128]], # 2
   [-1, 1, Conv, [256, 3, 2]],  # 3-P3/8
   [-1, 6, C3, [256]], # 4
   [-1, 1, Conv, [512, 3, 2]],  # 5-P4/16
   [-1, 9, C3, [512]], # 6
   [-1, 1, Conv, [1024, 3, 2]],  # 7-P5/32
   [-1, 3, C3, [1024]], # 8
   [-1, 1, SPPF, [1024, 5]],  # 9

    # IR stream (branch from P4/16 shared backbone)
   [-4, 1, Conv, [64, 6, 2, 2]],  # 10-P1/2
   [-1, 1, Conv, [128, 3, 2]],  # 11-P2/4
   [-1, 3, C3, [128]], # 12
   [-1, 1, Conv, [256, 3, 2]],  # 13-P3/8
   [-1, 6, C3, [256]], # 14
   [-1, 1, Conv, [512, 3, 2]],  # 15-P4/16
   [-1, 9, C3, [512]], # 16
   [-1, 1, Conv, [1024, 3, 2]],  # 17-P5/32
   [-1, 3, C3, [1024]], # 18
   [-1, 1, SPPF, [1024, 5]],  # 19

    ######### Fusion Block (Frequency-Decoupled) ##########
  [[2,12], 1, FreqDecoupledFusion, [128]],     # 20 P2:  low-freq(Mamba) + high-freq(gated)
  [[4,14], 1, FreqDecoupledFusion, [256]],     # 21 P3:  low-freq(Mamba) + high-freq(gated)
  [[6,16], 1, FreqDecoupledFusion, [512]],     # 22 P4:  low-freq(Mamba) + high-freq(gated)
  [[9,19], 1, FreqDecoupledFusion, [1024]],    # 23 P5:  low-freq(Mamba) + high-freq(gated)
  ]


# YOLOv5 head
head:
  [ [-1, 1, Conv, [512, 1, 1]], # 24
    [-1, 1, nn.Upsample, [None, 2, 'nearest']], # 25
    [[-1, 22], 1, Concat, [1]],  # cat backbone P4. 26
    [-1, 3, C3, [512, False]],  # 27

    [-1, 1, Conv, [512, 1, 1]],
    [-1, 1, nn.Upsample, [None, 2, 'nearest']],
    [[-1, 21], 1, Concat, [1]],  # cat backbone P3
    [-1, 3, C3, [512, False]],  # 31

    [-1, 1, Conv, [256, 1, 1]],
    [-1, 1, nn.Upsample, [None, 2, 'nearest']],
    [[-1, 20], 1, Concat, [1]],  # cat backbone P2
    [-1, 3, C3, [256, False]],  # 35 (P2/4-xsmall)

    [-1, 1, Conv, [256, 3, 2]],
    [[-1, 32], 1, Concat, [1]],  # cat head P3
    [-1, 3, C3, [256, False]],  # 38 (P3/8-small)

    [-1, 1, Conv, [256, 3, 2]],
    [[-1, 28], 1, Concat, [1]],  # cat head P4
    [-1, 3, C3, [512, False]],  # 41 (P4/16-medium)

    [-1, 1, Conv, [512, 3, 2]],
    [[-1, 24], 1, Concat, [1]],  # cat head P5
    [-1, 3, C3, [1024, False]],  # 44 (P5/32-large)

    [[35, 38, 41, 44], 1, Detect, [nc, anchors]],  # Detect(P2, P3, P4, P5)
  ]